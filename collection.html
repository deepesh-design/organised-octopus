<style>
  html, body { margin: 0; padding: 0; background: #fff; }
  * { box-sizing: border-box; }
  a { color: var(--link-default); }
  a:hover { color: var(--link-hover); }
  /* hover label slide-swap: current label slides up+out, duplicate slides in from below */
  .r-hov { position: relative; display: inline-block; overflow: hidden; vertical-align: top; }
  .r-hov-ph { visibility: hidden; }
  .r-hov-a, .r-hov-b { position: absolute; top: 0; left: 0; width: 100%; transition: transform .45s cubic-bezier(.65,0,.35,1); }
  .r-hov-b { top: 100%; }
  .r-hovable:hover .r-hov-a, .r-hovable:hover .r-hov-b { transform: translateY(-100%); }
  .sort-toggle {
    display: flex; align-items: center; gap: 8px; background: none; border: none;
    border-bottom: 1px solid var(--oo-black); padding: 6px 0; cursor: pointer;

    .sort-dropdown .sort-menu { left: 0 !important; right: auto !important; width: 220px; }
    .r-loading-img { width: 100px !important; }
    .r-tile-tag { font-size: 14px !important; }
    .r-menu-ov-links { grid-column: 1 / -1 !important; margin-left: 0 !important; gap: 12px !important; }

<script type="text/babel">
const { SiteHeader, MenuOverlay, SiteFooter } = window.OrganiedOctopusDesignSystem_10b7e1;

const LOADING_IMAGES = ['assets/products/sm/geometric-dog-side-table.webp', 'assets/products/sm/pink-elephant-side-table.webp', 'assets/products/sm/nobo-side-stand.webp', 'assets/products/sm/tree-hugger-side-table.webp', 'assets/products/sm/chess-pieces-black-gold.webp', 'assets/products/sm/chess-pieces-bronze.webp', 'assets/products/sm/teddy-statue.webp', 'assets/products/sm/elephant-planter.webp', 'assets/products/sm/head-side-table.webp', 'assets/products/sm/fireplace-side-table.webp', 'assets/products/sm/elephant-lamp.webp', 'assets/products/sm/dab-bear-side-table.webp', 'assets/products/sm/panther-sculpture.webp', 'assets/products/sm/panda-side-table.webp', 'assets/products/sm/bronze-monkey-side-table.webp', 'assets/products/sm/lion-head-wall-mount.webp', 'assets/products/sm/geometric-deer-head.webp'];

const PRODUCTS = [
  { id: 'geometric-deer-head', slug: 'geometric-deer-head', name: 'Geometric Deer Head', cat: 'Entryway', tag: 'A low-poly deer head, framed and mounted on the wall.', added: 23, img: 'assets/products/geometric-deer-head.webp' },
  { id: 'geometric-dog-side-table', slug: 'geometric-dog-side-table', name: 'Geometric Dog Side Table', cat: 'Entryway', tag: 'A low-poly dog holding a brass tray.', added: 22, img: 'assets/products/geometric-dog-side-table.webp' },
  { id: 'lion-head-wall-mount', slug: 'lion-head-wall-mount', name: 'Lion Head Wall Mount', cat: 'Entryway', tag: 'A bronze lion head, mounted and ready to watch the room.', added: 21, img: 'assets/products/lion-head-wall-mount.webp' },
  { id: 'elephant-planter', slug: 'elephant-wall-planter', name: 'Elephant Wall Planter', cat: 'Little Corners', tag: 'A carved elephant head with room for a plant on top.', added: 20, img: 'assets/products/elephant-planter.webp' },
  { id: 'bronze-monkey-side-table', slug: 'bronze-monkey-side-table', name: 'Bronze Monkey Side Table', cat: 'Living Room', tag: 'A bronze monkey holding a round glass tray overhead.', added: 18, img: 'assets/products/bronze-monkey-side-table.webp' },
  { id: 'pink-elephant-side-table', slug: 'pink-elephant-side-table', name: 'Pink Elephant Side Table', cat: 'Bedside', tag: 'A pink elephant balancing a round tabletop on its trunk.', added: 15, img: 'assets/products/pink-elephant-side-table.webp' },
  { id: 'nobo-side-stand', slug: 'nobo-side-stand', name: 'Nobo Side Stand', cat: 'Little Corners', tag: 'A round little creature with an open shelf on its head.', added: 14, img: 'assets/products/nobo-side-stand.webp' },
  { id: 'tree-hugger-side-table', slug: 'tree-hugger-side-table', name: 'Tree Hugger Side Table', cat: 'Little Corners', tag: 'A bear hugging a tree that holds up a scalloped tray.', added: 13, img: 'assets/products/tree-hugger-side-table.webp' },
  { id: 'chess-pieces-black-gold', slug: 'black-gold-chess-trio', name: 'Black & Gold Chess Trio', cat: 'Living Room', tag: 'A knight, a king and a queen in black and gold.', added: 12, img: 'assets/products/chess-pieces-black-gold.webp' },
  { id: 'chess-pieces-bronze', slug: 'bronze-chess-trio', name: 'Bronze Chess Trio', cat: 'Living Room', tag: 'A knight, a queen and a king in antique bronze.', added: 11, img: 'assets/products/chess-pieces-bronze.webp' },
  { id: 'teddy-statue', slug: 'visor-bear-sculpture', name: 'Visor Bear Sculpture', cat: 'Living Room', tag: 'A matte black bear in a visor and big boots.', added: 10, img: 'assets/products/teddy-statue.webp' },
  { id: 'head-side-table', slug: 'head-case-side-table', name: 'Head Case Side Table', cat: 'Bedside', tag: 'A classical head that holds a stack of books and a lamp.', added: 7, img: 'assets/products/head-side-table.webp' },
  { id: 'fireplace-side-table', slug: 'ember-side-table', name: 'Ember Side Table', cat: 'Little Corners', tag: 'A small fire with a wide mouth. Snacks go inside.', added: 6, img: 'assets/products/fireplace-side-table.webp' },
  { id: 'elephant-lamp', slug: 'elephant-lamp', name: 'Elephant Lamp', cat: 'Bedside', tag: 'A little lighthearted. Literally.', added: 5, img: 'assets/products/elephant-lamp.webp' },
  { id: 'dab-bear-side-table', slug: 'butler-bear-side-table', name: 'Butler Bear Side Table', cat: 'Entryway', tag: 'A dabbing bear in a cap, serving from a brass tray.', added: 4, img: 'assets/products/dab-bear-side-table.webp' },
  { id: 'panther-sculpture', slug: 'panther-sculpture', name: 'Panther Sculpture', cat: 'Living Room', tag: 'A faceted panther on a rock, with gold light running through it.', added: 3, img: 'assets/products/panther-sculpture.webp' },
  { id: 'panda-side-table', slug: 'panda-side-table', name: 'Panda Side Table', cat: 'Bedside', tag: 'A panda. A table. Apparently, both were necessary.', added: 2, img: 'assets/products/panda-side-table.webp' },
];

const CATEGORIES = ['Entryway', 'Bedside', 'Living Room', 'Little Corners'];

function sortProducts(list, sortVal) {
  const arr = list.slice();
  arr.sort((a, b) => {
    switch (sortVal) {
      case 'name-asc': return a.name.localeCompare(b.name);
      default: return b.added - a.added;
    }
  });
  return arr;
}

function ChevronIcon({ open }) {
  return (
    <svg width="12" height="8" viewBox="0 0 12 8" style={{ transform: open ? 'rotate(180deg)' : 'none', transition: 'transform var(--duration-fast) ease', flexShrink: 0 }}>
      <path d="M1 1.5L6 6.5L11 1.5" stroke="currentColor" strokeWidth="1.5" fill="none" strokeLinecap="square" />
    </svg>
  );
}

const SORT_OPTIONS = [
  { value: 'newest', label: 'Recently added' },
  { value: 'name-asc', label: 'Name A\u2013Z' },
];

function SwapLabel({ text }) {
  return (
    <span className="r-hov">
      <span className="r-hov-ph">{text}</span>
      <span className="r-hov-a">{text}</span>
      <span className="r-hov-b" aria-hidden="true">{text}</span>
    </span>
  );
}

function SortDropdown({ value, onChange }) {
  const [open, setOpen] = React.useState(false);
  const ref = React.useRef(null);
  const current = SORT_OPTIONS.find(o => o.value === value) || SORT_OPTIONS[0];

  React.useEffect(() => {
    function onDocClick(e) {
      if (ref.current && !ref.current.contains(e.target)) setOpen(false);
    }
    document.addEventListener('mousedown', onDocClick);
    return () => document.removeEventListener('mousedown', onDocClick);
  }, []);

  return (
    <div className="sort-dropdown" ref={ref} style={{ position: 'relative' }}>
      <button type="button" className="sort-toggle r-hovable" onClick={() => setOpen(o => !o)} aria-haspopup="listbox" aria-expanded={open}>
        <SwapLabel text={current.label} />
        <ChevronIcon open={open} />
      </button>
      {open && (
        <div className="sort-menu" role="listbox" style={{
          position: 'absolute', top: 'calc(100% + 8px)', right: 0, zIndex: 10,
          background: 'var(--surface-page)', border: '1px solid var(--border-hairline)', minWidth: 220,
        }}>
          {SORT_OPTIONS.map(o => (
            <button
              key={o.value}
              type="button"
              role="option"
              aria-selected={o.value === value}
              className="sort-option r-hovable"
              onClick={() => { onChange(o.value); setOpen(false); }}
              style={{ background: o.value === value ? 'var(--oo-black)' : 'transparent', color: o.value === value ? 'var(--oo-white)' : 'var(--text-primary)' }}
            ><SwapLabel text={o.label} /></button>
          ))}
        </div>
      )}
    </div>
  );
}

function ProductTile({ p }) {
  const href = './pieces/' + p.slug;
  return (
    <div style={{ display: 'flex', flexDirection: 'column' }}>
      <a href={href} style={{ display: 'block' }}>
        <img src={p.img} alt={p.name} style={{ display: 'block', width: '100%', aspectRatio: '1/1', objectFit: 'cover' }} />
      </a>
      <div style={{ padding: '12px 0 0' }}>
        <a href={href} style={{ color: 'inherit', textDecoration: 'none' }}>
          <p className="r-tile-name" style={{ fontSize: 'var(--text-body)', fontWeight: 500, fontFamily: 'var(--font-display)', margin: 0 }}>{p.name}</p>
        </a>
      </div>
      <div style={{ marginTop: 'auto', paddingTop: 12 }}>
        <a href={href} className="oo-bar r-hovable">
          <SwapLabel text="View details" />
          <svg width="16" height="10" viewBox="0 0 16 10" fill="none" style={{ flexShrink: 0 }} aria-hidden="true"><path d="M0.5 5H15.5M15.5 5L11 0.5M15.5 5L11 9.5" stroke="currentColor" strokeWidth="1.5" /></svg>
        </a>
      </div>
    </div>
  );
}

function LoadingScreen({ visible }) {
  const loadingImg = React.useMemo(() => LOADING_IMAGES[Math.floor(Math.random() * LOADING_IMAGES.length)], []);
  return (
    <div style={{
      position: 'fixed', inset: 0, zIndex: 100, background: 'var(--surface-page)', color: 'var(--text-primary)', padding: 16,
      transform: visible ? 'translateY(0%)' : 'translateY(-100%)',
      transition: 'transform 1s cubic-bezier(.77,0,.18,1)',
    }}>
      <img className="r-loading-img" src={loadingImg} alt="" style={{ position: 'absolute', top: 16, left: 16, width: 160, aspectRatio: '1/1', objectFit: 'cover' }} />
      <img src="assets/loading-icon.svg" alt="Organised Octopus" style={{ position: 'absolute', top: '50%', left: '50%', transform: 'translate(-50%,-50%)', width: 180, display: 'block' }} />
      <p style={{ position: 'absolute', bottom: 16, right: 16, fontSize: 'var(--text-loading)', fontWeight: 500, lineHeight: 'var(--text-loading-line)', letterSpacing: 'var(--tracking-normal)', margin: 0, maxWidth: 380, textAlign: 'right' }}>
        Make room for strange. Furniture, lamps and sculptures for rooms with a bit of personality.
      </p>
    </div>
  );
}

// Coming back from a product page: no loading screen, straight to the collection.
const SKIP_LOADER = (() => {
  try {
    const flag = sessionStorage.getItem('ooSkipLoader');
    sessionStorage.removeItem('ooSkipLoader');
    return !!flag || /\/pieces\//.test(document.referrer);
  } catch (e) { return false; }
})();

function Page() {
  const [menuOpen, setMenuOpen] = React.useState(false);
  const [cat, setCat] = React.useState(() => {
    const h = decodeURIComponent(window.location.hash.slice(1)).toLowerCase();
    return CATEGORIES.find(c => c.toLowerCase() === h) || 'all';
  });
  const [sort, setSort] = React.useState('newest');
  const [loading, setLoading] = React.useState(!SKIP_LOADER);
  const [loadingDone, setLoadingDone] = React.useState(SKIP_LOADER);
  const footerRef = React.useRef(null);
  const spacerRef = React.useRef(null);

  React.useEffect(() => {
    if (SKIP_LOADER) return;
    document.documentElement.style.overflow = 'hidden';
    document.body.style.overflow = 'hidden';
    let timers = [];
    function startReveal() {
      timers.push(setTimeout(() => {
        setLoading(false);
        document.documentElement.style.overflow = '';
        document.body.style.overflow = '';
      }, 700));
      timers.push(setTimeout(() => setLoadingDone(true), 1900));
    }
    // preload the loading-screen icon so it never flashes in blank —
    // only start the reveal countdown once it's actually ready to paint
    const icon = new Image();
    icon.src = 'assets/loading-icon.svg';
    if (icon.complete) {
      startReveal();
    } else {
      icon.onload = startReveal;
      icon.onerror = startReveal;
      timers.push(setTimeout(startReveal, 1200)); // fallback if load never fires
    }
    return () => { timers.forEach(clearTimeout); };
  }, []);

  React.useEffect(() => {
    function resize() {
      if (footerRef.current && spacerRef.current) {
        spacerRef.current.style.height = footerRef.current.offsetHeight + 'px';
      }
    }
    resize();
    window.addEventListener('resize', resize);
    window.addEventListener('load', resize);
    const imgs = footerRef.current ? footerRef.current.querySelectorAll('img') : [];
    imgs.forEach(img => { if (!img.complete) img.addEventListener('load', resize, { once: true }); });
    const t = setTimeout(resize, 600);
    return () => { window.removeEventListener('resize', resize); window.removeEventListener('load', resize); clearTimeout(t); };
  }, []);

  const filtered = cat === 'all' ? PRODUCTS : PRODUCTS.filter(p => p.cat === cat);
  const sorted = sortProducts(filtered, sort);

  return (
    <div style={{ position: 'relative', fontFamily: 'var(--font-sans)', color: 'var(--text-primary)', letterSpacing: 'var(--tracking-tight)', WebkitFontSmoothing: 'antialiased', overflowX: 'clip' }}>
      {!loadingDone && <LoadingScreen visible={loading} />}

      <div style={{ position: 'relative', zIndex: 1, background: 'var(--surface-page)' }}>
      <SiteHeader logoSrc="icon-black-mrdekrfj.svg" menuOpen={menuOpen} onToggleMenu={() => setMenuOpen(o => !o)} homeHref="./" />

      <div style={{ padding: '140px 16px 120px' }}>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(12,1fr)', gap: 16 }}>
          <h1 className="r-big" style={{ gridColumn: '1 / 13', fontSize: 'var(--text-hero)', lineHeight: 'var(--text-hero-line)', fontWeight: 700, fontFamily: 'var(--font-display)', letterSpacing: '0', margin: 0 }}>
            Collection
          </h1>
        </div>

        <div className="filterbar" style={{
          display: 'flex', justifyContent: 'space-between', alignItems: 'center',
          padding: '32px 16px 16px', borderBottom: '1px solid var(--border-hairline)', margin: '0 0 32px',
        }}>
          <div className="cat-pills" style={{ display: 'flex', gap: 24, flexWrap: 'wrap' }}>
            {['all', ...CATEGORIES].map(c => (
              <button
                key={c}
                onClick={() => setCat(c)}
                className="r-hovable"
                style={{
                  background: 'none', border: 'none', fontFamily: 'inherit', fontSize: 'var(--text-body)',
                  fontWeight: 500, letterSpacing: 'var(--tracking-tight)', padding: 0, cursor: 'pointer',
                  color: cat === c ? 'var(--text-primary)' : 'var(--text-disabled)',
                }}
              ><SwapLabel text={c === 'all' ? 'All' : c} /></button>
            ))}
          </div>
          <SortDropdown value={sort} onChange={setSort} />
        </div>

        <div id="product-grid" style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '44px 16px', padding: '0 16px' }}>
          {sorted.map(p => <ProductTile key={p.id} p={p} />)}
        </div>

        <div className="oo-contact-sec">
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(12,1fr)', gap: 16 }}>
            <div style={{ gridColumn: '1 / 13', paddingBottom: 16, overflow: 'hidden' }}>
              <h2 className="oo-contact-h2">Got something in mind? Let’s give it a place.</h2>
            </div>
            <div style={{ gridColumn: '1 / 13', height: 1, background: '#e5e5e5', marginTop: -8 }}></div>
          </div>
          <div className="oo-contact-row">
            <p className="r-label" style={{ gridColumn: '1 / 5', fontSize: 14, fontWeight: 700, fontFamily: 'var(--font-display)', margin: 0, color: '#8f8f8f' }}>Custom work</p>
            <div style={{ gridColumn: '5 / 9', display: 'flex', flexDirection: 'column', gap: 24 }}>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
                <p style={{ fontSize: 16, fontWeight: 500, lineHeight: '130%', margin: 0 }}>Sometimes the thing you want doesn’t exist yet. A piece made for an awkward corner. A strange idea that needs somewhere to live. Something for your home, business or space.</p>
                <p style={{ fontSize: 16, fontWeight: 500, lineHeight: '130%', margin: 0 }}>If you can imagine it, let’s see what we can make of it.</p>
              </div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
